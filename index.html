
<!DOCTYPE html>
<html lang="en">
  <head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <style>
      :root {
        --neon-green: #9EFD38;
        --blood-red: #D90429;
        --silver: #C0C0C0;
        --deep-black: #0a0a0a;
      }

      @keyframes noise {
        0%, 100% { transform: translate(0, 0); }
        10% { transform: translate(-1px, -1px); }
        20% { transform: translate(1px, 1px); }
        30% { transform: translate(-2px, 2px); }
        40% { transform: translate(2px, -2px); }
        50% { transform: translate(-1px, 2px); }
      }
      
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes flicker {
        0% { opacity: 0.27861; }
        5% { opacity: 0.34769; }
        10% { opacity: 0.23604; }
        15% { opacity: 0.90626; }
        20% { opacity: 0.18128; }
        25% { opacity: 0.83891; }
        30% { opacity: 0.65583; }
        35% { opacity: 0.57807; }
        40% { opacity: 0.26559; }
        45% { opacity: 0.84693; }
        50% { opacity: 0.96019; }
        55% { opacity: 0.08594; }
        60% { opacity: 0.20313; }
        65% { opacity: 0.71988; }
        70% { opacity: 0.53455; }
        75% { opacity: 0.37288; }
        80% { opacity: 0.71428; }
        85% { opacity: 0.70419; }
        90% { opacity: 0.7003; }
        95% { opacity: 0.36108; }
        100% { opacity: 0.24387; }
      }

      @keyframes tracking {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }

      @keyframes glitch-anim {
        0% { clip: rect(42px, 9999px, 44px, 0); transform: skew(0.5deg); }
        5% { clip: rect(12px, 9999px, 59px, 0); transform: skew(0.5deg); }
        10% { clip: rect(81px, 9999px, 10px, 0); transform: skew(0.5deg); }
        15% { clip: rect(75px, 9999px, 73px, 0); transform: skew(0.5deg); }
        20% { clip: rect(40px, 9999px, 23px, 0); transform: skew(0.5deg); }
        25% { clip: rect(62px, 9999px, 1px, 0); transform: skew(0.5deg); }
        30% { clip: rect(37px, 9999px, 34px, 0); transform: skew(0.5deg); }
        35% { clip: rect(4px, 9999px, 94px, 0); transform: skew(0.5deg); }
        40% { clip: rect(18px, 9999px, 78px, 0); transform: skew(0.5deg); }
        45% { clip: rect(56px, 9999px, 63px, 0); transform: skew(0.5deg); }
        50% { clip: rect(11px, 9999px, 49px, 0); transform: skew(0.5deg); }
        55% { clip: rect(42px, 9999px, 44px, 0); transform: skew(0.5deg); }
        60% { clip: rect(12px, 9999px, 59px, 0); transform: skew(0.5deg); }
        65% { clip: rect(81px, 9999px, 10px, 0); transform: skew(0.5deg); }
        70% { clip: rect(75px, 9999px, 73px, 0); transform: skew(0.5deg); }
        75% { clip: rect(40px, 9999px, 23px, 0); transform: skew(0.5deg); }
        80% { clip: rect(62px, 9999px, 1px, 0); transform: skew(0.5deg); }
        85% { clip: rect(37px, 9999px, 34px, 0); transform: skew(0.5deg); }
        90% { clip: rect(4px, 9999px, 94px, 0); transform: skew(0.5deg); }
        95% { clip: rect(18px, 9999px, 78px, 0); transform: skew(0.5deg); }
        100% { clip: rect(56px, 9999px, 63px, 0); transform: skew(0.5deg); }
      }

      body {
        background-color: var(--deep-black);
        color: #F5F5F5;
        font-family: 'Inter', sans-serif;
        cursor: crosshair;
        overflow-x: hidden;
      }

      .font-bebas { font-family: 'Bebas Neue', sans-serif; }
      .font-tech-mono { font-family: 'Share Tech Mono', monospace; }
      .font-vt323 { font-family: 'VT323', monospace; }
      
      .noise-overlay {
        position: fixed;
        top: -50%; left: -50%; width: 200%; height: 200%;
        background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJub2lzZSI+PGZlVHVyYnVsZW5jZSB0eXBlPSJmcmFjdGFsTm9pc2UiIGJhc2VGcmVxdWVuY3k9IjAuNjUiIG51bU9jdGF2ZXM9IjMiIHN0aXRjaFRpbGVzPSJzdGl0Y2giLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjbm9pc2UpIi8+PC9zdmc+');
        opacity: 0.04;
        pointer-events: none;
        z-index: 100;
        animation: noise 0.2s infinite linear;
      }

      .scanline-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100vh;
        background: linear-gradient(to bottom, transparent, transparent 50%, rgba(255, 255, 255, 0.02) 50%, rgba(255, 255, 255, 0.02) 100%);
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 101;
      }

      .animate-fade-in { animation: fade-in 0.6s ease-out forwards; }
      .animate-flicker { animation: flicker 0.1s infinite; }
      .animate-tracking { animation: tracking 4s linear infinite; }

      .glitch-text {
        position: relative;
        display: inline-block;
      }

      .glitch-text::before,
      .glitch-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      .glitch-text::before {
        left: 2px;
        text-shadow: -2px 0 #ff00c1;
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim 5s infinite linear alternate-reverse;
      }

      .glitch-text::after {
        left: -2px;
        text-shadow: -2px 0 #00fff9, 2px 2px #ff00c1;
        animation: glitch-anim 2s infinite linear alternate-reverse;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: var(--deep-black); }
      ::-webkit-scrollbar-thumb { background: #333; }
      ::-webkit-scrollbar-thumb:hover { background: var(--silver); }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
