    <style>
      @keyframes noise {
        0%, 100% { transform: translate(0, 0); }
        10% { transform: translate(-1px, -1px); }
        20% { transform: translate(1px, 1px); }
        30% { transform: translate(-2px, 2px); }
        40% { transform: translate(2px, -2px); }
        50% { transform: translate(-1px, 2px); }
        60% { transform: translate(2px, 1px); }
        70% { transform: translate(-2px, -1px); }
        80% { transform: translate(1px, -2px); }
        90% { transform: translate(2px, 2px); }
      }
      @keyframes scanline {
        0% { transform: translateY(0); }
        100% { transform: translateY(100vh); }
      }
      @keyframes text-glitch {
        0% {
          clip-path: inset(89% 0 1% 0);
          transform: translate(-10px, 1px);
        }
        20% {
          clip-path: inset(45% 0 55% 0);
          transform: translate(5px, -2px);
        }
        40% {
          clip-path: inset(93% 0 2% 0);
          transform: translate(-3px, 2px);
        }
        60% {
          clip-path: inset(12% 0 85% 0);
          transform: translate(8px, -1px);
        }
        80% {
          clip-path: inset(50% 0 49% 0);
          transform: translate(-5px, 1px);
        }
        100% {
          clip-path: inset(83% 0 3% 0);
          transform: translate(2px, -2px);
        }
      }
      body {
        background-color: #0a0a0a;
        color: rgba(255, 255, 255, 0.8);
        font-family: 'VT323', monospace;
        cursor: crosshair;
      }
      .font-tech-mono {
        font-family: 'Share Tech Mono', monospace;
      }
      .font-vt323 {
        font-family: 'VT323', monospace;
      }
      .noise-overlay {
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJub2lzZSI+PGZlVHVyYnVsZW5jZSB0eXBlPSJmcmFjdGFsTm9pc2UiIGJhc2VGcmVxdWVuY3k9IjAuNjUiIG51bU9jdGF2ZXM9IjMiIHN0aXRjaFRpbGVzPSJzdGl0Y2giLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjbm9pc2UpIi8+PC9zdmc+');
        opacity: 0.07;
        pointer-events: none;
        z-index: 100;
        animation: noise 0.2s infinite linear;
      }
      .scanline-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0) 50%,
          rgba(255, 255, 255, 0.05) 51%,
          rgba(0,0,0,0.1) 100%
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 101;
        /* animation: scanline 10s linear infinite; -- removed for less motion sickness */
      }
      .glitch-text {
        position: relative;
      }
      .glitch-text:hover::before,
      .glitch-text:hover::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0a;
      }
      .glitch-text:hover::before {
        left: 2px;
        text-shadow: -2px 0 #ff003c;
        animation: text-glitch 1.5s infinite linear alternate-reverse;
      }
      .glitch-text:hover::after {
        left: -2px;
        text-shadow: -2px 0 #6a00ff, 2px 2px #ff003c;
        animation: text-glitch 2s infinite linear alternate-reverse;
      }
    </style>
